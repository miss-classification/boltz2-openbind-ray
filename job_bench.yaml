# Anyscale Job: benchmark one checkpoint on one target (scripts/bench_checkpoints.py,
# and the base-<model>-<target> runs of public checkpoints).
#
#   anyscale job submit -f job_bench.yaml --name base-of3p2-ev71-2a -- python aiddd_pipeline.py \
#     --target ev71-2a --models of3p2 --max-gpus 8 --of3-per-gpu 2 --cpus-per-gpu-node 16 \
#     --pred-dir <fresh dir> --out <own results dir>
#
# g6.4xlarge, not g6.2xlarge: the 32 GB of a g6.2xlarge ran out with three OpenFold3 0.4.3
# predictors on one node (base-of3p2, 2026-10-22: the raylet was OOM-killed 20 times and
# the job churned through 43 nodes). 64 GB and 16 vCPU also make OpenFold3 1.44x faster
# per ligand (packing sweep, job_workshop.yaml). Always pass --out: the default
# results/<target> is deleted when a run starts.
name: aiddd-bench
image_uri: anyscale/image/aiddd-boltz2-of3:4
working_dir: .
excludes: [image, docs, .git, __pycache__, "*.ipynb"]
env_vars:
  AIDDD_SHARED: /mnt/user_storage/aiddd
compute_config:
  head_node:
    instance_type: m5.2xlarge
    resources: {CPU: 0}                   # the head node only drives the pipeline
  worker_nodes:
    - name: l4
      instance_type: g6.4xlarge           # 1x L4 24 GB, 16 vCPU, 64 GB RAM
      min_nodes: 0
      max_nodes: 16
    - name: cpu
      instance_type: m5.4xlarge           # pose scoring
      min_nodes: 0
      max_nodes: 4
  enable_cross_zone_scaling: true
entrypoint: python aiddd_pipeline.py --help
max_retries: 0

<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>The Service app: one request, composed across CPU and GPU deployments</title>
  <desc>The client posts a SMILES to the Viewer. The Viewer, on CPU, prepares it with RDKit (1), sends it to OF3Pool for the pose and to Boltz2Live for the affinity at the same time and waits for both answers (2), then scores the pose against the crystal with RDKit (3) and returns one JSON answer.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="920" height="520" fill="#ffffff"/>

  <!-- Client -->
  <rect x="16" y="90" width="130" height="80" rx="8" fill="#f4f5f7" stroke="#c9ced6"/>
  <text x="81" y="115" text-anchor="middle" font-size="14" font-weight="600" fill="#22272e">Client</text>
  <text x="81" y="134" text-anchor="middle" font-size="12" fill="#444c56">viewer page,</text>
  <text x="81" y="149" text-anchor="middle" font-size="12" fill="#444c56">notebook, curl</text>
  <text x="81" y="164" text-anchor="middle" font-size="11" fill="#6a737d" font-family="ui-monospace, Menlo, monospace">POST /predict</text>

  <!-- Viewer (CPU) -->
  <rect x="190" y="40" width="270" height="410" rx="10" fill="#eef3fb" stroke="#7d9bc7"/>
  <text x="325" y="64" text-anchor="middle" font-size="15" font-weight="700" fill="#22272e">Viewer (CPU)</text>
  <text x="325" y="81" text-anchor="middle" font-size="12" fill="#444c56">FastAPI ingress · 2 to 4 replicas</text>

  <rect x="205" y="95" width="240" height="64" rx="6" fill="#ffffff" stroke="#b6c6df"/>
  <text x="217" y="116" font-size="13" font-weight="600" fill="#22272e">1. Prepare (RDKit)</text>
  <text x="217" y="135" font-size="12" fill="#444c56">canonical SMILES; find the</text>
  <text x="217" y="150" font-size="12" fill="#444c56">crystal of the same compound</text>

  <rect x="205" y="185" width="240" height="152" rx="6" fill="#ffffff" stroke="#b6c6df"/>
  <text x="217" y="206" font-size="13" font-weight="600" fill="#22272e">2. Ask both GPU models</text>
  <text x="217" y="224" font-size="11" fill="#22272e" font-family="ui-monospace, Menlo, monospace">await asyncio.gather(...)</text>
  <text x="217" y="252" font-size="12" fill="#444c56">sends both requests at once,</text>
  <text x="217" y="267" font-size="12" fill="#444c56">then waits for both answers</text>
  <text x="217" y="300" font-size="12" fill="#444c56">the GPUs work in parallel;</text>
  <text x="217" y="315" font-size="12" fill="#444c56">the Viewer only waits</text>

  <rect x="205" y="363" width="240" height="64" rx="6" fill="#ffffff" stroke="#b6c6df"/>
  <text x="217" y="384" font-size="13" font-weight="600" fill="#22272e">3. Score (RDKit)</text>
  <text x="217" y="403" font-size="12" fill="#444c56">ligand RMSD to the crystal;</text>
  <text x="217" y="418" font-size="12" fill="#444c56">pose moved onto the crystal</text>

  <!-- steps 1 -> 2 -> 3 -->
  <line x1="325" y1="159" x2="325" y2="182" stroke="#5b6472" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="325" y1="337" x2="325" y2="360" stroke="#5b6472" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- OF3Pool (GPU) -->
  <rect x="590" y="40" width="310" height="200" rx="10" fill="#f2f8f3" stroke="#7fb08c"/>
  <text x="745" y="64" text-anchor="middle" font-size="15" font-weight="700" fill="#22272e">OF3Pool: pose (GPU)</text>
  <text x="745" y="82" text-anchor="middle" font-size="12" fill="#444c56">½ L4 · 15 GB RAM · OpenFold3 0.4.x</text>
  <text x="745" y="97" text-anchor="middle" font-size="11" fill="#6a737d">in its own Python (runtime_env)</text>
  <text x="606" y="122" font-size="12" fill="#22272e">@serve.multiplexed: model id → weights</text>
  <rect x="606" y="132" width="88" height="26" rx="4" fill="#ffffff" stroke="#9cc6a6"/>
  <text x="650" y="150" text-anchor="middle" font-size="12" fill="#22272e">base</text>
  <rect x="701" y="132" width="88" height="26" rx="4" fill="#ffffff" stroke="#9cc6a6"/>
  <text x="745" y="150" text-anchor="middle" font-size="12" fill="#22272e">ev71-v1</text>
  <rect x="796" y="132" width="88" height="26" rx="4" fill="#ffffff" stroke="#9cc6a6"/>
  <text x="840" y="150" text-anchor="middle" font-size="12" fill="#22272e">ev71-v2</text>
  <text x="606" y="182" font-size="12" fill="#444c56">up to 3 in memory; the model list is</text>
  <text x="606" y="197" font-size="12" fill="#444c56">user_config, changed in place</text>
  <text x="606" y="222" font-size="11" fill="#6a737d">a cached pose answers without the GPU</text>

  <!-- Boltz2Live (GPU) -->
  <rect x="590" y="282" width="310" height="128" rx="10" fill="#fbf5ec" stroke="#d1a866"/>
  <text x="745" y="306" text-anchor="middle" font-size="15" font-weight="700" fill="#22272e">Boltz2Live: affinity (GPU)</text>
  <text x="745" y="324" text-anchor="middle" font-size="12" fill="#444c56">½ L4 · 15 GB RAM · Boltz-2</text>
  <text x="606" y="350" font-size="12" fill="#444c56">OpenFold3 does not predict affinity</text>
  <text x="606" y="366" font-size="12" fill="#444c56">1 replica, on the other L4 node</text>
  <text x="606" y="392" font-size="11" fill="#6a737d">a cached affinity answers without the GPU</text>

  <!-- step 2 <-> GPU deployments: request (solid) and response (dashed) -->
  <line x1="445" y1="200" x2="587" y2="200" stroke="#5b6472" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="516" y="193" text-anchor="middle" font-size="11" fill="#22272e">SMILES + model id</text>
  <line x1="590" y1="222" x2="448" y2="222" stroke="#5b6472" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="516" y="237" text-anchor="middle" font-size="11" fill="#22272e">pose, ipTM, source</text>

  <line x1="445" y1="300" x2="587" y2="300" stroke="#5b6472" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="516" y="293" text-anchor="middle" font-size="11" fill="#22272e">SMILES</text>
  <line x1="590" y1="322" x2="448" y2="322" stroke="#5b6472" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="516" y="337" text-anchor="middle" font-size="11" fill="#22272e">affinity, P(binder)</text>

  <!-- legend -->
  <line x1="476" y1="56" x2="506" y2="56" stroke="#5b6472" stroke-width="1.6"/>
  <text x="512" y="60" font-size="11" fill="#444c56">request</text>
  <line x1="476" y1="74" x2="506" y2="74" stroke="#5b6472" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="512" y="78" font-size="11" fill="#444c56">response</text>

  <!-- client -> 1, and 3 -> client -->
  <line x1="146" y1="127" x2="202" y2="127" stroke="#5b6472" stroke-width="1.6" marker-end="url(#arr)"/>
  <polyline points="205,395 81,395 81,173" fill="none" stroke="#5b6472" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="90" y="268" font-size="11" fill="#22272e">one JSON answer:</text>
  <text x="90" y="283" font-size="11" fill="#444c56">pose · RMSD</text>
  <text x="90" y="298" font-size="11" fill="#444c56">affinity · model</text>
  <text x="90" y="313" font-size="11" fill="#444c56">source · zone</text>

  <text x="460" y="490" text-anchor="middle" font-size="12" fill="#6a737d">One Anyscale Service: 2 L4 nodes, GPUs from any availability zone in the region. Each deployment scales on its own.</text>
</svg>

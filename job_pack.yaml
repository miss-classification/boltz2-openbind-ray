# Anyscale Job: how many predictors fit on one L4, and how much CPU that needs.
#
# One GPU node, one setting at a time, same ligands throughout. Run it twice and
# compare: the only difference is the vCPU count of the GPU worker.
#
#   anyscale job submit -f job_pack.yaml --name pack8      # g6.2xlarge, 8 vCPU (as written)
#   # then change instance_type to g6.4xlarge and --cpus-per-gpu-node to 16:
#   anyscale job submit -f job_pack.yaml --name pack16
#
# About 80 minutes of one L4 per run.
name: aiddd-pack-sweep
image_uri: anyscale/image/aiddd-boltz2-of3:4
working_dir: .
excludes: [image, docs, .git, __pycache__, "*.ipynb"]
env_vars:
  AIDDD_SHARED: /mnt/user_storage/aiddd
compute_config:
  head_node:
    instance_type: m5.2xlarge
    resources: {CPU: 0}                   # the head node only drives the sweep
  worker_nodes:
    - name: l4
      instance_type: g6.2xlarge           # 1x L4, 8 vCPU. g6.4xlarge for the 16 vCPU run
      min_nodes: 1                        # one node, held for the whole sweep
      max_nodes: 1
  enable_cross_zone_scaling: true
entrypoint: python scripts/pack_sweep.py --cpus-per-gpu-node 8
max_retries: 0
